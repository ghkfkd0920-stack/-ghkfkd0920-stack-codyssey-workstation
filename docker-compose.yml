# 보너스: Docker Compose (멀티 컨테이너 + 환경 변수)
# 실행: docker compose up -d --build
services:
  web:
    build: .
    image: my-web:1.0
    container_name: compose-web
    ports:
      - "${HOST_PORT:-8090}:${NGINX_PORT:-80}"
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      APP_MODE: ${APP_MODE:-compose}
    depends_on:
      - whoami

  # 보조 서비스: 요청 정보를 돌려주는 작은 HTTP 서버
  whoami:
    image: traefik/whoami
    container_name: compose-whoami
    # 호스트에 포트를 열지 않음 -> 같은 Compose 네트워크 안에서만 서비스명(whoami)으로 접근
